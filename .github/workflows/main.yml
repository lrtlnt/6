name: XP-Sim Build
on:
  workflow_dispatch:

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  NDK_VERSION: "26.2.11394342"

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 【第一步：最先运行JDK17，绝对不能放后面】
      - name: Setup JDK 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        # 强制全局JAVA_HOME
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # 完全抛弃 setup-android action，手动下载SDK
      - name: Download & Setup Android SDK Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          cd $ANDROID_HOME/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076758_latest.zip
          unzip -q commandlinetools-linux-11076758_latest.zip
          rm commandlinetools-linux-11076758_latest.zip
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-24" "build-tools;34.0.0" "ndk;${{ env.NDK_VERSION }}"

      - name: Permission shell script
        run: chmod +x ./build_android.sh

      - name: Build APK
        run: ./build_android.sh

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: XP-Simulator-APK
          path: ./android/app/build/outputs/apk/release/app-release-unsigned.apk


  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install vcpkg & SDL2
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-ttf:x64-windows
      - name: CMake Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: XP-Sim-Win64
          path: build/Release/*.exe
